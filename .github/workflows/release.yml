name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  checks: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 26 }
      - run: make web-check
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version-file: go.mod }
      - run: make dist VERSION="${GITHUB_REF_NAME}"
      - name: Sanity-check the amd64 binary reports the tag
        run: |
          ver="${GITHUB_REF_NAME#v}"
          tar -xzf "dist/superwitness_${ver}_linux_amd64.tar.gz" -C "$RUNNER_TEMP"
          got="$("$RUNNER_TEMP/superwitness_${ver}_linux_amd64/superwitness" --version)"
          test "$got" = "$GITHUB_REF_NAME" || { echo "version $got != tag $GITHUB_REF_NAME" >&2; exit 1; }
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS scripts/install.sh --generate-notes

  # The tag's release is now published; put it in production on the production host. It does not rerun the
  # tests: it refuses unless the tag is on main and main's CI (go, web, integration) passed for
  # this exact commit. The key can only run /usr/local/sbin/prod-deploy (`superwitness v<x.y.z>`,
  # installed by the host's provisioning), which runs deploy/release.sh from the tag: the
  # checksum, a database backup, migrate, the switch, /health, the smoke, rollback on failure.
  deploy-production:
    name: deploy (production)
    needs: [release]
    runs-on: ubuntu-latest
    concurrency: { group: deploy-production, cancel-in-progress: false }
    environment: { name: production, url: https://app.superwitness.dev }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0, persist-credentials: false }
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Main's CI passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Passed means success, or skipped by ci.yml's `changes` job (which itself passed) because
          # the commit touched only landing/ or docs-site/: the app then is the code its parent tested.
          conclusion() {
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=$1&per_page=100" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions") | .conclusion] | if any(. == "success") then "success" elif any(. == "skipped") then "skipped" else (first // "missing") end'
          }
          planned=$(conclusion changes)
          echo "changes: $planned"
          for job in go web integration; do
            got=$(conclusion "$job")
            echo "$job: $got"
            [ "$got" = success ] || { [ "$got" = skipped ] && [ "$planned" = success ]; } \
              || { echo "ci job '$job' has not passed for $GITHUB_SHA" >&2; exit 1; }
          done
      - name: Deploy to production
        env:
          KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
          HOST: ${{ vars.PROD_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # shellcheck disable=SC2029  # expanding the tag on this side is the point
          ssh root@"$HOST" superwitness "$GITHUB_REF_NAME"
      - name: Smoke the public URL
        run: EXPECT_ISSUER=https://accounts.superjackfruit.com sh deploy/staging/smoke.sh https://app.superwitness.dev

name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  # Which parts changed. A pull request or push that only touches landing/ or docs-site/ runs
  # just their builds; anything else, the workflows themselves, or any other trigger runs it all.
  # A skipped go/web/integration on main is safe for release.yml's production check: the app is
  # then the code its parent tested, and the check accepts "skipped" only when this job passed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.plan.outputs.app }}
      landing: ${{ steps.plan.outputs.landing }}
      docs: ${{ steps.plan.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            app:
              - '**'
              - '!landing/**'
              - '!docs-site/**'
            workflows:
              - '.github/**'
            landing:
              - 'landing/**'
            docs:
              - 'docs-site/**'
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          APP: ${{ steps.filter.outputs.app }}
          WORKFLOWS: ${{ steps.filter.outputs.workflows }}
          LANDING: ${{ steps.filter.outputs.landing }}
          DOCS: ${{ steps.filter.outputs.docs }}
        run: |
          app=false
          case "$EVENT" in push|pull_request) ;; *) app=true ;; esac
          if [ "$APP" = true ] || [ "$WORKFLOWS" = true ]; then app=true; fi
          landing=$LANDING; docs=$DOCS
          if [ "$app" = true ]; then landing=true; docs=true; fi
          { echo "app=$app"; echo "landing=$landing"; echo "docs=$docs"; } >> "$GITHUB_OUTPUT"
          echo "app=$app landing=$landing docs=$docs"
  go:
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make lint
      - run: make test
      - run: make licenses
      - run: sudo useradd -r superwitness && sudo install -m 0755 /bin/true /usr/local/bin/superwitness && systemd-analyze verify deploy/superwitness.service
      - run: bash deploy/release.test.sh
  web:
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 26 }
      - run: make web-check
  integration:
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make test-integration
  e2e:
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 26 }
      - run: make web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: make e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: |
            web/test-results
            web/playwright-report
          retention-days: 7
          if-no-files-found: ignore
  # Every push to main deploys that commit to the staging plane (workbench), where it signs in
  # against staging-accounts. Production is unchanged: a v* tag (release.yml). The key can only run
  # /usr/local/sbin/staging-deploy (`<product> <sha>`), and the deploy ends with
  # deploy/staging/smoke.sh.
  deploy-staging:
    name: deploy (staging)
    runs-on: ubuntu-latest
    needs: [go, web, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency: { group: deploy-staging, cancel-in-progress: false }
    environment: { name: staging, url: https://staging-app.superwitness.dev }
    steps:
      - name: Deploy
        env:
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          HOST: ${{ vars.STAGING_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh root@"$HOST" superwitness "$GITHUB_SHA"
  # The two public sites. Build-only: deploys run from the operator's machine with
  # scripts/deploy-sites.sh and a wrangler login, so this repository holds no
  # Cloudflare token. npm, scoped to each directory, because both sit outside the
  # Go module and have their own lockfiles.
  landing:
    needs: [changes]
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: landing
      - run: npm run build
        working-directory: landing
  docs:
    needs: [changes]
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: docs-site
      - run: npm run build
        working-directory: docs-site

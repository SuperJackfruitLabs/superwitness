name: docs-touched
# A pull request that changes the public surface (routes, settings, the CLI, MCP tools, the
# published contracts, the installer, the app's pages) must touch docs-site/, docs/ or README.md,
# or carry the no-docs-needed label. scripts/docs-touched.sh lists the paths. Its own workflow,
# not a ci.yml job, so adding or removing the label re-runs only this check.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
jobs:
  docs-touched:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: bash scripts/docs-touched.test.sh
      - name: Check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: git diff --name-only "$BASE...$HEAD" | bash scripts/docs-touched.sh

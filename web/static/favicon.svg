<!-- The superwitness mark: a seal (ring) enclosing an eye. src/components/Mark.astro inlines
     the same three shapes and must match this file; the build guard in README.md checks it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="#3fd0a2" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- #3fd0a2 is 1.9:1 on a white tab; a light browser theme gets the deep jade instead. -->
  <style>@media (prefers-color-scheme: light) { circle, path { stroke: #1b7f63; } .pupil { fill: #1b7f63; stroke: none; } }</style>
  <circle cx="16" cy="16" r="13.5"/>
  <path d="M7 16c2.5-4.3 5.6-6.4 9-6.4s6.5 2.1 9 6.4c-2.5 4.3-5.6 6.4-9 6.4s-6.5-2.1-9-6.4z"/>
  <circle class="pupil" cx="16" cy="16" r="2.75" fill="#3fd0a2" stroke="none"/>
</svg>
